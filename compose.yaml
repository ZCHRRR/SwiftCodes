services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: swiftcodes
      POSTGRES_USER: swift
      POSTGRES_PASSWORD: swift
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swift -d swiftcodes"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swiftcodes
      SPRING_DATASOURCE_USERNAME: swift
      SPRING_DATASOURCE_PASSWORD: swift
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: