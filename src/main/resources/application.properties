spring.application.name=swiftcodes

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftcodes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:swift}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:swift}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

swift.csv.file=swift_codes.csv